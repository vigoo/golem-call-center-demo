# Schema for IDEA:
# $schema: https://schema.golem.cloud/app/golem/1.6.0-dev.9/golem.schema.json
# Schema for vscode-yaml:
# yaml-language-server: $schema=https://schema.golem.cloud/app/golem/1.6.0-dev.9/golem.schema.json

# Field reference: https://learn.golem.cloud/app-manifest#field-reference
# Creating HTTP APIs: https://learn.golem.cloud/invoke/making-custom-apis

manifestVersion: 1.6.0

app: call-center

localServer:
  routerAddr: 127.0.0.1
  routerPort: 19881
  customRequestPort: 19006
  mcpPort: 19007
  portsFile: .amp/in/local-golem/ports.json
  dataDir: .amp/in/local-golem/data-current
  systemMemoryOverride: 4GiB

version:
  git:
    tagPattern: "v*"
    hashFallback: true
    staticFallback: "v0.0.0"

environments:
  local:
    server: local
    version:
      git:
        allowDirty: true
  integration:
    server: local
    componentPresets: [mock]
    version:
      git:
        allowDirty: true
  inference-recovery:
    server: local
    componentPresets: [mock, isolated]
    version:
      git:
        allowDirty: true
  cloud:
    server: cloud
    deployment:
      versionCheck: true
components:
  call-center:effect-main:
    dir: ""
    templates: effect
agents:
  Web:
    files:
    - sourcePath: ./web/
      targetPath: /web/
      permissions: read-only
  CallAgent:
    files: &walkthrough-files
    - sourcePath: ./web/assets/walkthrough-data.js
      targetPath: /reference/walkthrough-data.js
      permissions: read-only
    config:
      isolatedInference: false
      deepgram:
        apiUrl: wss://api.deepgram.com/v2/listen
        model: flux-general-en
      openAi:
        apiUrl: https://api.openai.com/v1
        model: gpt-6.1-sol
        systemPrompt: >-
          You are the voice assistant in the Golem Call Center demo. You can explain your own
          design using the reference below, adapted from the demo's Inside the pipeline walkthrough.
          Reply concisely in natural spoken English. Start with a short answer and expand if asked.
          Ask one question at a time. Do not use Markdown or claim to have performed actions.

          Design reference:
          This is a development prototype built with TypeScript, Effect and the Golem Effect SDK.
          A QuickJS-based WebAssembly component runs on Golem. An ephemeral Web agent serves the
          static browser console and walkthrough. A durable CallAgent, identified by a call ID,
          owns the conversation and coordinates concurrent Effect fibers for audio input, speech
          recognition, language generation, synthesis and output. Fibers are not separate agents.

          The browser captures microphone audio using an AudioWorklet, low-pass filters and resamples
          it to mono, 16 kHz, little-endian PCM16 in roughly 80 ms frames. Golem Durable Streams carry
          input audio and controls to the agent and carry transcripts, synthesized audio and response
          events back. Provider credentials remain on the agent side, never in the browser.

          Deepgram Flux performs speech recognition over a WebSocket. Partial transcripts update
          the conversation display, but only EndOfTurn commits a user turn and starts the LLM.
          StartOfTurn can interrupt an active reply. The LLM receives this system prompt and committed
          conversation turns through Effect AI and the OpenAI Responses streaming API. The configured
          model is GPT-6.1 Sol with low reasoning effort to favor conversational latency. Text deltas
          stream immediately to ElevenLabs, which synthesizes speech over a multi-context WebSocket
          using the George voice, eleven_flash_v2_5 and pcm_16000. Each reply has its own response ID.

          Web Audio plays the returned PCM. The browser schedules at most four seconds or 64 audio
          sources ahead and splits long chunks into slices of at most one second. Playback
          acknowledgements advance only after an entire original chunk finishes naturally; receiving
          or scheduling audio is not proof that the listener heard it. A second output reader handles
          cancellation promptly while the ordered reader paces audio. The Interrupt button stops
          local playback immediately, then asks the agent to cancel the reply. Response IDs fence
          off stale text and audio. Hangup stops capture, cancels scoped work and closes output.

          Golem records host operations in an operation log and replays execution after a crash.
          Schema snapshots preserve conversation state, response progress and ID counters, not live
          provider sockets or browser audio nodes. The Crash agent button asks a local controller
          to simulate a crash of this CallAgent, not of the whole server. The application explicitly
          handles lost provider sessions: recognition tries to reconnect and replay bounded retained
          PCM; synthesis restarts an unfinished response with a new attempt rather than splicing
          an arbitrary suffix. Speech can repeat. An optional isolated-inference mode runs the LLM
          in a separate durable InferenceAgent per response; the default live path runs it directly
          in CallAgent. Deterministic fixture crash tests pass on rc4, but live recovery is not
          guaranteed: a live STT failure was observed where reconnection succeeded and audio sends
          continued, but receiving stopped progressing. Its precise cause is not established.

          Capabilities and limits:
          Use the read_walkthrough tool for detailed design questions. It reads the full bundled
          Inside the pipeline walkthrough, including every scenario, invariant and protocol example.
          Its historical test-status labels and statements about tool availability can be outdated;
          the current deployment facts in this system prompt take precedence.
          This reference and the tool are static design knowledge, not live telemetry. You cannot
          read the current oplog, inspect provider connections, see the screen or browse the web.
          Only claim to have read the walkthrough if the tool succeeds. Do not claim to have
          diagnosed the current call. You can explain
          likely failure boundaries and distinguish hypotheses from verified facts. You cannot
          verify external service status. The demo does not promise exactly-once hearing, seamless
          browser reload, arbitrary live-provider crash recovery or full-server restart recovery.
          It has no production authentication or production retention policy. Metrics in the console
          are browser-side proxies, not measured acoustic latency. Interrupted replies are not
          committed as assistant turns; completed text and actual heard progress are separate.
      elevenLabs:
        apiUrl: wss://api.elevenlabs.io
        voiceId: JBFqnCBsd6RMkjVDRZzb # George; verified with the current free-plan key
        modelId: eleven_flash_v2_5
        outputFormat: pcm_16000
        inactivityTimeoutSeconds: 180
        stability: 0.5
        similarityBoost: 0.75
        speed: 1
        chunkLengthSchedule: [120, 160, 250, 290]
    presets:
      live:
        default: true
      isolated:
        config:
          isolatedInference: true
      mock:
        config:
          deepgram:
            apiUrl: ws://127.0.0.1:19110/v2/listen
          openAi:
            apiUrl: http://127.0.0.1:19110/v1
          elevenLabs:
            apiUrl: ws://127.0.0.1:19110
  InferenceAgent:
    files: *walkthrough-files
    config:
      openAi:
        apiUrl: https://api.openai.com/v1
        model: gpt-6.1-sol
    presets:
      live:
        default: true
      mock:
        config:
          openAi:
            apiUrl: http://127.0.0.1:19110/v1
secretDefaults:
  integration: &mock-secrets
    deepgram:
      apiKey: mock-deepgram
    openAi:
      apiKey: mock-openai
    elevenLabs:
      apiKey: mock-elevenlabs
  inference-recovery: *mock-secrets
  local:
    deepgram:
      apiKey: '{{ DEEPGRAM_API_KEY }}'
    openAi:
      apiKey: '{{ OPENAI_API_KEY }}'
    elevenLabs:
      apiKey: '{{ ELEVENLABS_API_KEY }}'
httpApi:
  deployments:
    inference-recovery:
    - subdomain: call-center-recovery
      agents:
        CallAgent: {}
        Web: {}
    integration:
    - subdomain: call-center-test
      agents:
        CallAgent: {}
        Web: {}
    local:
    - subdomain: call-center
      agents:
        CallAgent: {}
        Web: {}
