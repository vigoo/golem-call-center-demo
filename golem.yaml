# Schema for IDEA:
# $schema: https://schema.golem.cloud/app/golem/1.6.0-dev.9/golem.schema.json
# Schema for vscode-yaml:
# yaml-language-server: $schema=https://schema.golem.cloud/app/golem/1.6.0-dev.9/golem.schema.json

# Field reference: https://learn.golem.cloud/app-manifest#field-reference
# Creating HTTP APIs: https://learn.golem.cloud/invoke/making-custom-apis

manifestVersion: 1.6.0

app: call-center

localServer:
  routerAddr: 127.0.0.1
  routerPort: 19881
  customRequestPort: 19006
  mcpPort: 19007
  portsFile: .amp/in/local-golem/ports.json
  dataDir: .amp/in/local-golem/data-current
  systemMemoryOverride: 4GiB

version:
  git:
    tagPattern: "v*"
    hashFallback: true
    staticFallback: "v0.0.0"

environments:
  local:
    server: local
    version:
      git:
        allowDirty: true
  integration:
    server: local
    version:
      git:
        allowDirty: true
  cloud:
    server: cloud
    deployment:
      versionCheck: true
components:
  call-center:effect-main:
    dir: ""
    templates: effect
agents:
  Web:
    files:
    - sourcePath: ./web/
      targetPath: /web/
      permissions: read-only
  CallAgent:
    config:
      deepgram:
        apiUrl: wss://api.deepgram.com/v2/listen
        model: flux-general-en
      openAi:
        apiUrl: https://api.openai.com/v1
        model: gpt-4o-mini
        systemPrompt: >-
          You are a helpful phone assistant. Reply concisely in natural spoken English.
          Ask one question at a time. Do not use Markdown or claim to have performed actions.
      elevenLabs:
        apiUrl: wss://api.elevenlabs.io
        voiceId: 21m00Tcm4TlvDq8ikWAM
        modelId: eleven_flash_v2_5
        outputFormat: pcm_16000
        inactivityTimeoutSeconds: 180
        stability: 0.5
        similarityBoost: 0.75
        speed: 1
        chunkLengthSchedule: [120, 160, 250, 290]
    presets:
      mock:
        config:
          deepgram:
            apiUrl: ws://127.0.0.1:19110/v2/listen
          openAi:
            apiUrl: http://127.0.0.1:19110/v1
          elevenLabs:
            apiUrl: ws://127.0.0.1:19110
secretDefaults:
  integration:
    deepgram:
      apiKey: mock-deepgram
    openAi:
      apiKey: mock-openai
    elevenLabs:
      apiKey: mock-elevenlabs
  local:
    deepgram:
      apiKey: '{{ DEEPGRAM_API_KEY }}'
    openAi:
      apiKey: '{{ OPENAI_API_KEY }}'
    elevenLabs:
      apiKey: '{{ ELEVENLABS_API_KEY }}'
httpApi:
  deployments:
    integration:
    - subdomain: call-center-test
      agents:
        CallAgent: {}
        Web: {}
    local:
    - subdomain: call-center
      agents:
        CallAgent: {}
        Web: {}
